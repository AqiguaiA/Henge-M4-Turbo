name: Debug Xcode SDK
on:
  workflow_dispatch: {}
jobs:
  debug:
    runs-on: xcode-27
    steps:
      - name: Which Xcode has NSURLHandle.h
        run: |
          for x in /Applications/Xcode*.app; do
            dev="$x/Contents/Developer"
            sdk=$(DEVELOPER_DIR="$dev" xcrun --sdk iphoneos --show-sdk-path 2>/dev/null) || continue
            ver=$(DEVELOPER_DIR="$dev" xcodebuild -version 2>/dev/null | head -1)
            if [ -f "$sdk/System/Library/Frameworks/Foundation.framework/Headers/NSURLHandle.h" ]; then
              echo "OK   $x | $ver | $sdk"
            else
              echo "MISS $x | $ver | $sdk"
            fi
          done
