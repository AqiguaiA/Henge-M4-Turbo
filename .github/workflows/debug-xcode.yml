name: Debug Xcode SDK
on:
  workflow_dispatch: {}
jobs:
  debug:
    runs-on: xcode-27
    steps:
      - name: Compare Foundation headers iOS vs macOS
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          MAC=$(xcrun --sdk macosx --show-sdk-path)
          IOSF="$SDK/System/Library/Frameworks/Foundation.framework/Headers"
          MACF="$MAC/System/Library/Frameworks/Foundation.framework/Headers"
          echo "iOS header count: $(ls "$IOSF" | wc -l)"
          echo "macOS header count: $(ls "$MACF" | wc -l)"
          echo "--- in macOS but not iOS (first 60) ---"
          comm -23 <(ls "$MACF" | sort) <(ls "$IOSF" | sort) | head -60
          echo "--- key headers present on iOS? ---"
          for h in NSGeometry.h NSKeyedArchiver.h NSURLHandle.h NSObject.h NSURL.h Foundation.h; do
            [ -f "$IOSF/$h" ] && echo "present $h" || echo "MISSING $h"
          done
          ls "$IOSF" | head -20
