# .github/workflows/build-ipa.yml
#
# Builds an Apple M4 optimized Henge-Turbo.ipa on GitHub-hosted Xcode runners
# with -O3 -mcpu=apple-m4 and all 6 architectural optimizations enabled.

name: Build Henge M4-Turbo IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  HUSK: ${{ github.workspace }}/Husk
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out Henge
        uses: actions/checkout@v4
        with:
          path: Henge

      - name: Check out Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          path: Husk

      - name: Cache Husk dependencies
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh') }}

      - name: Install build tools
        run: |
          set -euxo pipefail
          brew install xcodegen meson ninja pkg-config
          rustup target add aarch64-apple-ios || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            rustup target add aarch64-apple-ios
          }

      - name: Fetch Husk sources
        working-directory: Husk
        run: bash scripts/fetch_sources.sh

      - name: Build iOS sysroot deps
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp

      - name: Build Husk pairing library
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh

      - name: Copy prebuilt deps into Henge
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build restore stack
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      - name: Run EngineTuning Swift test & core unit tests
        working-directory: Henge
        run: |
          set -euo pipefail
          ulimit -s 65520
          make test-engine-tuning
          make build/test_classify build/test_jit_region build/test_operands build/test_helper_regs build/test_mmu build/test_jit build/test_mem build/test_exc build/test_shutdown
          ./build/test_classify
          ./build/test_jit_region
          ./build/test_operands
          ./build/test_helper_regs
          ./build/test_mmu
          ./build/test_jit
          ./build/test_mem
          ./build/test_exc
          ./build/test_shutdown

      - name: Build M4-Turbo engine (-O3 -mcpu=apple-m4)
        working-directory: Henge
        run: make ios-lib IOS_CFLAGS="-std=c11 -Wall -Wextra -O3 -mcpu=apple-m4 -g -Icore -Ihost -Idevices -I${IOS_DEPS}/include/slirp"

      - name: Patch iPhoneOS SDK Foundation headers (Xcode 27 SDK bug)
        working-directory: Henge
        run: |
          set -euxo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          MACSDK=$(xcrun --sdk macosx --show-sdk-path)
          H="$SDK/System/Library/Frameworks/Foundation.framework/Headers"
          MH="$MACSDK/System/Library/Frameworks/Foundation.framework/Headers"
          sudo cp ios/shim/Foundation/NSURLHandle.h "$H/NSURLHandle.h"
          # The iPhoneOS SDK's own Foundation umbrella imports headers it does not
          # ship (NSGeometry.h and 40-odd others). Fill every gap from the macOS
          # SDK of the same Xcode; extra Mac-only headers are inert on iOS.
          for f in "$MH"/*.h; do
            b=$(basename "$f")
            [ -f "$H/$b" ] || sudo cp "$f" "$H/$b"
          done
          printf '%s\n' '#import <Foundation/Foundation.h>' 'int henge_sdk_check(void){return 0;}' > /tmp/sdkcheck.m
          clang -arch arm64 -miphoneos-version-min=17.0 -isysroot "$SDK" -fsyntax-only /tmp/sdkcheck.m
          printf '%s\n' 'import Foundation' 'public func hengeSDKCheck() {}' > /tmp/sdkcheck.swift
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios17.0 -sdk "$SDK" -emit-object /tmp/sdkcheck.swift -o /tmp/sdkcheck.o
          echo "SDK Foundation headers patched and verified"

      - name: Package Henge.ipa
        working-directory: Henge
        # Free Apple ID: get-task-allow + increased-memory-limit only (no -80045, TXM-safe).
        env:
          HENGE_ENTITLEMENTS: Henge/Henge.personal.entitlements
        run: zsh ios/scripts/package_ipa.sh

      - name: Upload Henge-M4-Turbo.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-M4-Turbo-ipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.ipa
          if-no-files-found: error
